name: Release

# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) builds the Windows installer and
# attaches it to a draft GitHub release; nothing is public until the draft is published.
# Run by hand (gh workflow run release.yml) it's a dry run: the same build, no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain has no version tags; this is the head of its `stable` branch.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The tag names the version users see; a mismatch would ship one version labelled as another.
      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -EQ 'sonicnet').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $version (Cargo.toml)."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed.' }
          }

      # Optional: with the WINDOWS_CERT_PFX_BASE64 secret (and WINDOWS_CERT_PASSWORD) the exe,
      # setup and uninstaller are signed; without it the build is unsigned.
      - name: Load the signing certificate
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if ($env:CERT_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'sonicnet-sign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
            "SONICNET_SIGN_CERT=$pfx" >> $env:GITHUB_ENV
          }

      - name: Build installer
        shell: pwsh
        env:
          SONICNET_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./packaging/windows/build.ps1

      - name: Remove the certificate
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'sonicnet-sign.pfx')

      # Re-running a tag's workflow replaces the installer on the existing draft.
      - name: Attach to a draft release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem target/installer/SonicNet-Setup-*.exe | Select-Object -ExpandProperty FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $setup --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $setup --draft --title $env:GITHUB_REF_NAME --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the draft release failed.' }
