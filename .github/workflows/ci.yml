name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain has no version tags; this is the head of its `stable` branch.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  extension:
    name: Browser extension
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every step is skipped until the extension has a package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('extension/package.json') != ''
        with:
          node-version: 22

      - name: Install
        if: hashFiles('extension/package.json') != ''
        shell: pwsh
        run: if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Build
        if: hashFiles('extension/package.json') != ''
        run: npm run build --if-present

      - name: Test
        if: hashFiles('extension/package.json') != ''
        run: npm test --if-present
